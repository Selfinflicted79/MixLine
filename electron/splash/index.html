<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file: data: blob:; media-src 'self' file: data: blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; script-src 'self' 'unsafe-inline';"
    />
    <title>MixLine</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07080d;
        color: #eef3ff;
        font-family: Segoe UI, sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: #07080d;
      }
      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #07080d;
      }
      .card {
        position: relative;
        z-index: 2;
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 0.55rem;
        padding: 1.4rem 2rem;
        border: 1px solid rgba(77, 232, 255, 0.25);
        border-radius: 0.35rem;
        background: rgba(10, 12, 18, 0.88);
        box-shadow: 0 0 40px rgba(77, 232, 255, 0.12);
        text-align: center;
        animation: rise 0.35s ease-out;
      }
      .card.show {
        display: flex;
      }
      .eyebrow {
        margin: 0;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #4de8ff;
      }
      .title {
        margin: 0;
        font-size: 2.4rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-shadow: 0 0 18px rgba(255, 79, 216, 0.35);
      }
      .sub {
        margin: 0;
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8b93a8;
      }
      .pulse {
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 999px;
        background: #5fd36a;
        box-shadow: 0 0 10px #5fd36a;
        animation: blink 1s ease-in-out infinite;
      }
      .unmute {
        position: absolute;
        z-index: 3;
        bottom: 0.85rem;
        right: 0.85rem;
        display: none;
        -webkit-app-region: no-drag;
        border: 1px solid rgba(77, 232, 255, 0.35);
        border-radius: 0.3rem;
        background: rgba(10, 12, 18, 0.9);
        color: #4de8ff;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 0.45rem 0.7rem;
        cursor: pointer;
      }
      .unmute.show {
        display: inline-flex;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <video id="clip" playsinline preload="auto" autoplay></video>
      <button type="button" class="unmute" id="unmute">Enable sound</button>
      <div class="card" id="card">
        <p class="eyebrow">Badly Played Hub</p>
        <p class="title">MixLine</p>
        <p class="sub">Booting the rack</p>
        <span class="pulse" aria-hidden="true"></span>
      </div>
    </div>
    <script>
      const video = document.getElementById("clip");
      const card = document.getElementById("card");
      const unmute = document.getElementById("unmute");
      let finished = false;
      let titleHold = false;

      function finish() {
        if (finished) return;
        finished = true;
        try {
          video.pause();
          video.muted = true;
        } catch {
          /* ignore */
        }
        if (window.splash && typeof window.splash.done === "function") {
          window.splash.done();
        }
      }

      function showTitleCard() {
        if (titleHold) return;
        titleHold = true;
        unmute.classList.remove("show");
        video.style.display = "none";
        card.classList.add("show");
        setTimeout(finish, 900);
      }

      const params = new URLSearchParams(window.location.search);
      const fromQuery = params.get("video");
      const fallback = new URL("./DevLoadingScreen.mp4", window.location.href).href;
      video.src = fromQuery || fallback;
      video.muted = false;
      video.volume = 1;
      video.addEventListener("ended", showTitleCard, { once: true });
      video.addEventListener("error", showTitleCard, { once: true });

      void video
        .play()
        .then(() => {
          unmute.classList.remove("show");
        })
        .catch(() => {
          video.muted = true;
          void video
            .play()
            .then(() => {
              unmute.classList.add("show");
            })
            .catch(() => showTitleCard());
        });

      unmute.addEventListener("click", () => {
        video.muted = false;
        video.volume = 1;
        void video.play();
        unmute.classList.remove("show");
      });

      setTimeout(() => {
        if (!finished && !titleHold) showTitleCard();
      }, 12000);
    </script>
  </body>
</html>
